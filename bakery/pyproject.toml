[project]
name = "bakery"
version = "0.1.0"
description = "agentic harness: pi control plane and claw gateway"
requires-python = ">=3.11"
dependencies = [
    "croniter==6.2.4",
    "discord.py==2.7.1",
    "pygments==2.21.0",
    "task",
]

[project.scripts]
bakery = "bakery.cli:main"

[dependency-groups]
dev = [
    "flake8-broken-line==1.0.0",
    "flake8-complicated-walrus==2.1.0",
    "flake8-import-restrictions==2.1",
    "flake8-requirements==2.3.0",
    "flake8==7.4.1",
    "hypothesis==6.170.2",
    "pylint==4.1.3",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "pytest==9.1.1",
    "types-croniter==6.2.4.20261006",
    "types-pygments==2.21.0.20260819",
]

[tool.pytest.ini_options]
addopts = "-n auto --dist worksteal"
pythonpath = ["."]
testpaths = ["tests"]
timeout = 30

# Install bakery with `uv tool install`: pip, and so pipx, ignores these.
# Tests and claws run this `task`, never another on PATH.
[tool.uv.sources]
task = { git = "https://github.com/TheKevJames/task", tag = "9.2.0" }

[tool.hatch.build.targets.wheel]
packages = ["bakery"]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
