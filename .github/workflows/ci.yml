name: ci

on: [pull_request, push]

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.12.23
          # renovate: datasource=docker depName=python
          python-version: 3.14.7
      - uses: j178/prek-action@v3.0.1
        with:
          # renovate: datasource=pypi depName=prek
          prek-version: v0.5.5
          extra-args: --all-files

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      # sandbox-runtime's Linux backend. Ubuntu's AppArmor otherwise strips
      # capabilities from bubblewrap's user namespaces, and its
      # bwrap-userns-restrict profile from the nested one sandbox-runtime's
      # seccomp helper creates.
      - run: |
          sudo apt-get update -q
          sudo apt-get install -qy bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          ls /etc/apparmor.d | grep -i -e bwrap -e userns || true
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
      - run: npm install -g "@earendil-works/pi-coding-agent@${pi_version}"
        env:
          # renovate: datasource=npm depName=@earendil-works/pi-coding-agent
          pi_version: 1.0.4
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: pi
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.12.23
      # The shared task list CLI, used by claws.
      - run: uv tool install "task @ git+https://github.com/TheKevJames/tools@task-5.0.0#subdirectory=task"
      - run: uv run --frozen pytest
        working-directory: bakery
