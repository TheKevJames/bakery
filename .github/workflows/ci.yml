name: ci

on: [pull_request, push]

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.6
          # renovate: datasource=docker depName=python
          python-version: 3.15.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: pi
      - uses: j178/prek-action@v3.1.0
        with:
          # renovate: datasource=pypi depName=prek
          prek-version: v0.5.7
          extra-args: --all-files

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # Bakery is macOS-only: claws run in sandbox-runtime's seatbelt backend,
    # and Linux's bubblewrap cannot make a not-yet-existing file (eg. pi's
    # lockfiles in a claw's profile) writable on its own.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - run: brew install ripgrep
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - run: npm install -g "@earendil-works/pi-coding-agent@${pi_version}"
        env:
          # renovate: datasource=npm depName=@earendil-works/pi-coding-agent
          pi_version: 1.4.0
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: pi
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.6
          # renovate: datasource=docker depName=python
          python-version: 3.15.2
      - run: uv run --frozen pytest
        working-directory: bakery
