# triage: researches each task tagged `triage` in the claws' namespace
# (scout's, and those the operator hands over), records its priority, size,
# and notes, and routes it to build, human, blocked, or wontfix; then sends
# blocked tasks back to triage once what they wait on clears.
# Research only: no reproduction, no edits.

model = "anthropic/claude-sonnet-5-5"
thinking = "high"

[limits]
cost_usd = 3.0  # per task, or per unblock or recheck

# One task per run, working through the queue. Also runs within two minutes
# of the task list changing (eg. scout or the operator adds tasks).
[[job]]
name = "queue"
cron = "0 * * * *"
prompt = "Triage this task."
collector = "triage"
repeat = true
watch = "${TASK_FOLDER}"
debounce_seconds = 120

# Blocked tasks whose blocking tasks have all cleared (eg. the operator
# answered one in human and it was re-triaged), back to triage. Runs only when
# there are some, so it watches the task list too.
[[job]]
name = "unblock"
cron = "0 * * * *"
prompt = "Unblock these tasks."
collector = "triage-unblock"
model = "anthropic/claude-haiku-5-5"
thinking = "low"
watch = "${TASK_FOLDER}"
debounce_seconds = 120

# Blocked tasks waiting on something external (an upstream issue, PR, or
# release), checked once a week before scout's daily run. Its collector also
# reports blocked tasks it cannot read.
[[job]]
name = "recheck"
cron = "0 6 * * 1"
prompt = "Recheck these blocked tasks."
collector = "triage-recheck"
silent_ok = true
