# triage: researches each task tagged `triage` in the claws' namespace
# (scout's, and those the operator hands over), records its priority, size,
# and notes, and routes it to ready, operator, or wontfix, asks the operator
# about it, or blocks it on what it waits on; then clears what blocked tasks
# wait on outside the task list, once it has happened. `task` sends them back
# to triage once all has.
# Research only: no reproduction, no edits.

model = "ggml-org/LFM2.5-24B-A2B-GGUF:Q4_K_M"
thinking = "high"

[limits]
cost_usd = 3.0  # per task, or per recheck

# One task per run, working through the queue. Also runs within two minutes
# of the task list changing (eg. scout or the operator adds tasks).
[[job]]
name = "queue"
cron = "0 * * * *"
prompt = "Triage this task."
collector = "triage"
repeat = true
watch = "${TASK_FOLDER}"
debounce_seconds = 120

# Blocked tasks waiting on something external (an upstream issue, PR, or
# release), checked once a week before scout's daily run.
[[job]]
name = "recheck"
cron = "0 6 * * 1"
prompt = "Recheck these blocked tasks."
collector = "triage-recheck"
silent_ok = true
