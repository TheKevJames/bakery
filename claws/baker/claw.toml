# baker: reviews how the other claws learn (memory, dreams, transcripts,
# refused and failed tool calls) and files a task for each gap it finds.
# Evidence is gathered by bakery/bakery/collectors/baker.py; baker reads every
# claw's state but writes only its own memory and new tasks for the operator.

model = "ggml-org/LFM2.5-24B-A2B-GGUF:Q4_K_M"
thinking = "high"

[limits]
cost_usd = 5.0
minutes = 45
turns = 100

[policy]
# Every claw's state, and the gateway's runs, logs, and sandbox violations.
read_paths = ["${TASK_FOLDER}", "${XDG_STATE_HOME}/claws"]

# After the 03:00 dreams, so it sees what they promoted.
[[job]]
name = "review"
cron = "0 4 * * *"
prompt = "Review how the claws are learning."
collector = "baker"
silent_ok = true
