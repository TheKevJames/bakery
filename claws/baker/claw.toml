# baker: reviews how the other claws learn (memory, dreams, transcripts,
# refused and failed tool calls) and files a task for each gap it finds.
# Evidence is gathered by bakery/bakery/collectors/baker.py; baker reads every
# claw's state but writes only its own memory and new tasks for Kevin.

model = "anthropic/claude-opus-5-5"
thinking = "high"

[limits]
cost_usd = 5.0
minutes = 45
turns = 100

[ask]
policy = "assume"  # its tasks are its questions for Kevin

[policy]
tools = [
    "read", "grep", "find", "ls", "bash",
    "web_search", "web_fetch", "github", "mcp__context7__*",
    "memory_append", "memory_search", "memory_get",
    "task_list", "task_show", "task_add",
]
allow_read = ["${XDG_STATE_HOME}/claws"]
# Never bakery/build: fixes change the claws themselves, so Kevin approves.
task_tag = "bakery/human"

# After the 03:00 dreams, so it sees what they promoted.
[[job]]
name = "review"
cron = "0 4 * * *"
prompt = "Review how the claws are learning."
collector = "baker"
silent_ok = true
