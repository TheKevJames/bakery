# scout: finds things in the operator's repos that belong on the task list
# (CI failures and warnings, issues and PRs, TODO comments) and adds them for
# triage.
# Candidates are gathered deterministically by bakery/bakery/collectors/
# scout.py from scout.toml; the model only writes them up.

model = "anthropic/claude-haiku-5-5"
thinking = "high"

[limits]
cost_usd = 2.0

[ask]
policy = "assume"  # never interrupt the operator; note assumptions in the report

[policy]
# Read-only, and no bash: the collector gathers everything scout needs.
tools = [
    "read", "grep", "find", "ls",
    "web_fetch", "github", "context7",
    "memory_append", "memory_search", "memory_get",
    "task_list", "task_add",
]

[[job]]
name = "daily"
cron = "0 7 * * *"
prompt = "Add today's candidates to the task list."
collector = "scout"
