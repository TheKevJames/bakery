# scout: finds things in the operator's repos that belong on the task list
# (CI failures and warnings, issues and PRs, to-do comments) and adds them for
# triage.
# Candidates are gathered deterministically by bakery/bakery/collectors/
# scout.py from scout.toml; the model only writes them up. Scout reads
# untrusted issue and PR text, so the model's GitHub token is read-only: a
# classic PAT with no scopes, which reads public repositories (all the claws
# work on). The collector runs in the gateway and reads GitHub with the
# gateway's BAKERY_GITHUB instead, as GitHub refuses Actions log downloads to
# a token with no scopes.

model = "anthropic/claude-haiku-5-5"
thinking = "high"
# Replaces the default list.
secrets = [
    "ANTHROPIC_API_KEY",
    "GH_TOKEN=BAKERY_GITHUB_READONLY",
]

[limits]
cost_usd = 2.0

[ask]
policy = "assume"  # never interrupt the operator; note assumptions in the report

[[job]]
name = "daily"
cron = "0 7 * * *"
prompt = "Add today's candidates to the task list."
collector = "scout"
