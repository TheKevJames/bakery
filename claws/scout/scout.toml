# Scout watches every repo the claws' GitHub user can reach (inviting it is
# how a repo is added): CI, open issues and non-bot PRs, and TODO/FIXME
# comments on the default branch, which the collector fetches into scout's
# own clone, under its state dir's clones/<owner>/<repo>.
#
# [[repo]] entries `exclude` git glob pathspecs from one repo by `name`, eg.
# for vendored code or prose that mentions TODOs. `bakery gateway check`
# reports entries for repos the claws cannot reach.

max_candidates = 25                # handed over per run; the rest wait
opt_out_label = "ready-for-human"  # issues and PRs with it are skipped

[[repo]]
name = "TheKevJames/bakery"
exclude = [
    "claws/**",
    "docs/**",
    "pi/rules/**",
    "pi/prompts/debug-todo.md",
    "pi/skills/vendor/**",
]

[[repo]]
name = "TheKevJames/challenges"
exclude = [
    "advent-*/**",
    "kattis/**",
    "polyeuler/**",
]

[[repo]]
name = "TheKevJames/dotsystem"
exclude = [
    "scripts/dotsystem_scripts/bash/todo",
]

[[repo]]
name = "TheKevJames/experiments"
exclude = [
    "asyncio-http-perf/**",
    "gw2/**",
    "league/**",
    "libspacerep/**",
    "multilang-lib/**",
    "tensorflow-perf/**",
]

[[repo]]
name = "TheKevJames/tools"
exclude = [
    "cctui/**",
]
