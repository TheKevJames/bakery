# Repos scout watches: CI, open issues and non-bot PRs, and TODO/FIXME
# comments on the default branch. `path` is the local checkout (its default
# branch is fetched into refs/bakery/scout/, leaving the checkout alone);
# `exclude` holds git glob pathspecs, eg. for vendored code or prose that
# mentions TODOs.

max_candidates = 25                # handed over per run; the rest wait
opt_out_label = "ready-for-human"  # issues and PRs with it are skipped

[[repo]]
name = "TheKevJames/bakery"
path = "~/src/personal/bakery"
exclude = [
    "claws/**",
    "docs/**",
    "pi/rules/**",
    "pi/prompts/debug-todo.md",
    "pi/skills/vendor/**",
]

[[repo]]
name = "TheKevJames/beancount-importer"
path = "~/src/personal/beancount-importer"

