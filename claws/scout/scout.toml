# Scout watches every repo the claws' GitHub user can reach (inviting it is
# how a repo is added): CI, open issues and non-bot PRs, and to-do comments
# on the default branch, which the collector fetches into scout's own clone,
# under its state dir's clones/<owner>/<repo>. Only comments count, not
# strings or prose (see bakery/bakery/collectors/scout_todos.py).
#
# [[repo]] entries `exclude` git glob pathspecs from one repo by `name`, eg.
# for vendored code. `bakery gateway check` reports entries for repos the
# claws cannot reach.
#
# `ignore_warnings` regexes are searched for in each CI warning line (as
# logged, eg. `##[warning]…`); matches are never candidates, nor count
# towards the per-repo cap. Keep them tight: a broad one hides real
# warnings, and a run's noise can sit beside them.

max_candidates = 25                # handed over per run; the rest wait
opt_out_label = "ready-for-human"  # issues and PRs with it are skipped
ignore_warnings = [
    # brew test-bot's cleanup, for runner-image formulae it did not install.
    'Skipping \S+: most recent version \S+ not installed$',
    'Treating \S+ as a formula\. For the cask, use ',
]

[[repo]]
name = "TheKevJames/bakery"
exclude = [
    "pi/skills/vendor/**",
]

[[repo]]
name = "TheKevJames/challenges"
exclude = [
    "advent-*/**",
    "kattis/**",
    "polyeuler/**",
]

[[repo]]
name = "TheKevJames/dotsystem"
exclude = [
    "scripts/dotsystem_scripts/bash/todo",
]

[[repo]]
name = "TheKevJames/experiments"
exclude = [
    "asyncio-http-perf/**",
    "gw2/**",
    "league/**",
    "libspacerep/**",
    "multilang-lib/**",
    "tensorflow-perf/**",
]

[[repo]]
name = "TheKevJames/tools"
exclude = [
    "cctui/**",
]
