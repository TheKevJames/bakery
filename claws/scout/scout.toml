# Scout watches every repo the claws' GitHub user can reach (inviting it is
# how a repo is added): CI, open issues and non-bot PRs, and TODO/FIXME
# comments on the default branch. The local checkout (its default branch is
# fetched into refs/bakery/scout/, leaving the checkout alone) is
# <checkouts>/<repo>; without one, the TODOs and CI warnings aren't scanned.
#
# [[repo]] entries override one repo by `name`: `path` (its checkout),
# `remote`, and `exclude` (git glob pathspecs, eg. for vendored code or prose
# that mentions TODOs). `bakery gateway check` reports overrides for repos the
# claws cannot reach.

checkouts = "~/src/personal"
max_candidates = 25                # handed over per run; the rest wait
opt_out_label = "ready-for-human"  # issues and PRs with it are skipped

[[repo]]
name = "TheKevJames/bakery"
exclude = [
    "claws/**",
    "docs/**",
    "pi/rules/**",
    "pi/prompts/debug-todo.md",
    "pi/skills/vendor/**",
]

[[repo]]
name = "TheKevJames/challenges"
exclude = [
    "advent-*/**",
    "kattis/**",
    "polyeuler/**",
]

[[repo]]
name = "TheKevJames/dotsystem"
exclude = [
    "scripts/dotsystem_scripts/bash/todo",
]

[[repo]]
name = "TheKevJames/experiments"
exclude = [
    "asyncio-http-perf/**",
    "gw2/**",
    "league/**",
    "libspacerep/**",
    "multilang-lib/**",
    "tensorflow-perf/**",
]

[[repo]]
name = "TheKevJames/tools"
exclude = [
    "cctui/**",
]
