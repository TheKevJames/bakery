# The gateway's own settings, which no claw can override; claw defaults are in
# defaults.toml. Apply changes with `bakery gateway reload`.

timezone = "Europe/Lisbon"  # cron schedules and the daily budget reset
max_processes = 4           # live pi children across all claws
daily_cost_usd = 50.0       # across all claws

[discord]
guild_id = 1465773145427280065     # the operator's private server
operator_id = 523678345662300161   # the only user the bot acts on

# What each claw may do to the task list (task's `task.rules` format; see
# bakery/bakery/task_list/claims.py). Whatever no rule grants is denied: a
# claw without a table may only read. Every claw writes only the claws'
# namespace, `bakery`, and never deletes a task, nor completes one (its
# source would be filed again) but for scout's own mistakes. Each claim
# belongs to one run, and ends with it.
# Saying something on a task (comments, and questions to the operator) needs
# no claim; only the operator answers questions. What `task` does to a task
# once what it waits on clears (back to triage, or gone if a duplicate) is no
# claw's to be granted.
# bakery/bakery/task_list/hooks.py adds checks rules cannot express: filing
# only new links, and moving a task to human only asking the operator
# something.

[tasks.scout.create]
namespaces = ["bakery"]
tags = ["triage"]
require = ["description", "link"]

# Scout claims nothing, so it holds, and may complete, only the tasks it adds
# in a run: to undo its own mistakes (eg. a garbled link) before triage
# builds on them.
[tasks.scout.change]
done = true

# Blocked tasks stay in triage, hidden until what they wait on clears.
[tasks.triage.create]
namespaces = ["bakery"]
tags = ["build", "human", "triage", "wontfix"]
require = ["description"]
fields = ["blocked_by", "duplicate_of", "priority", "size"]

[tasks.triage.claim]
namespaces = ["bakery"]
tags = ["triage"]

[tasks.triage.change]
fields = ["blocked_by", "duplicate_of", "priority", "size"]
tags = ["build", "human", "triage", "wontfix"]

# Its notes on what it triages.
[tasks.triage.comment]
namespaces = ["bakery"]
tags = ["build", "human", "triage", "wontfix"]

[tasks.triage.question]
namespaces = ["bakery"]
tags = ["human"]

# Never build: fixes change the claws themselves, so the operator approves.
[tasks.baker.create]
namespaces = ["bakery"]
tags = ["human"]
require = ["description", "link"]
fields = ["priority", "size"]

[tasks.baker.question]
namespaces = ["bakery"]
tags = ["human"]
