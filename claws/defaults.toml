# Gateway settings, and defaults for every claw. Each claws/<name>/claw.toml
# chooses its model and thinking (there is no default), may override any
# [claw] value (tables merge key by key), and adds its jobs.
# Apply changes with `bakery gateway reload`.

[gateway]
timezone = "Europe/Lisbon"  # cron schedules and the daily budget reset
max_processes = 4           # live pi children across all claws
daily_cost_usd = 50.0       # across all claws

[gateway.discord]
guild_id = 1465773145427280065     # the operator's private server
operator_id = 523678345662300161   # the only user the bot acts on

[claw]
enabled = true
# Environment variables passed to the claw; values come from the Keychain
# (see bakery/bakery/secrets.py), never the gateway's environment. Nothing
# else from the gateway's environment is passed on beyond PATH, HOME, locale,
# XDG_*, and TASK_FOLDER. Entries are `NAME` or `NAME=ITEM` (the variable
# NAME, valued from secret ITEM). pi and its extension tools see them; bash
# only sees `bash_secrets`. That is hygiene, not a boundary: bash shares pi's
# sandbox, so it could read the others from pi's environment.
secrets = [
    "ANTHROPIC_API_KEY",
    "GH_TOKEN=BAKERY_GITHUB",      # gh, git: the claws' GitHub user
]
# For git and gh in the claw's own clones; GitHub's rulesets keep it off the
# operator's default branches.
bash_secrets = ["GH_TOKEN"]

# cwd defaults to the claw's state dir, $XDG_STATE_HOME/claws/<name>.

# Paths are enforced by the OS sandbox the claw's whole pi runs in (see
# bakery/bakery/gateway/sandbox.py), so they bind pi, bash, and every tool
# alike. Tools are not policy: every claw has pi's default tools and every
# extension tool its profile loads, and its instructions say which to use.
# The sandbox also lets every claw reach any host, except by a name other
# than localhost resolving to this machine (loopback, link-local, its own
# addresses), and no unix socket but its own.
# Relative paths are relative to the claw's profile (claws/<name>/); ~ and
# ${VAR} expand.
# A claw's value for a key replaces the default list; repeat what it keeps.
[claw.policy]
# The only readable paths under $HOME, besides what pi needs to run (its
# install, the bakery repo, the claw's profile, own state, and _shared).
# Outside $HOME everything is readable but per-user temp and the claw state
# root ($XDG_STATE_HOME/claws).
read_paths = ["${TASK_FOLDER}"]
# Unreadable even within the readable paths.
deny_read = [
    "~/**/.env*", "~/**/*.tfvars", "~/**/*.pem",
    "~/**/id_rsa*", "~/**/id_dsa*", "~/**/id_ecdsa*", "~/**/id_ed25519*",
    "../../interactive/auth.json",
    # Other claws' pi credentials; the gateway re-allows the claw's own.
    "../*/auth.json",
]
# Writable, besides the claw's own state, pi's files in its profile, and its
# $TMPDIR; the rest of the repo is read-only. The memory tools are the
# intended writers of memory, but bash could write it. Of the task list, only
# the claws' namespace: the rest is the operator's.
write_paths = ["${TASK_FOLDER}/bakery"]

[claw.tasks]
# The tag task_add files into, in the claws' namespace of the task list.
tag = "triage"

# The identity of the claw's commits (the claws' GitHub user), in the git
# config the gateway writes into the claw's home at every start.
[claw.git]
user_name = "thekevjames-bakery"
user_email = "341569114+thekevjames-bakery@users.noreply.github.com"

[claw.limits]
cost_usd = 5.0        # per run
minutes = 30          # per run, excluding time waiting on the operator
turns = 50            # per run
daily_cost_usd = 20.0

[claw.concurrency]
max_active = 1         # concurrent new units of work
max_resumes = 0        # extra slots for resumed units (eg. PR feedback)
idle_exit_minutes = 15 # idle pi children exit; resume reloads the session

[claw.memory]
flush_margin_tokens = 8000  # flush memory this close to compaction
max_chars = 20000           # MEMORY.md's cap; match its context.toml budget

# Jobs here apply to every claw; a claw's job of the same name replaces one.
[[claw.job]]
name = "dream"
cron = "0 3 * * *"
prompt = "/dream"  # pi/claw-prompts/dream.md
model = "anthropic/claude-opus-5-5"
thinking = "medium"
silent_ok = true
# The operator's bakery commits since the last dream, to recheck memory
# against; the dream runs even when there are none.
collector = "changes"
skip_empty = false

# Run only by `bakery teach <claw|all> "<lesson>"`, which waits for the reply
# and the MEMORY.md diff: the claw checks the operator's lesson and corrects
# its memory.
[[claw.job]]
name = "learn"
prompt = "/learn"  # pi/claw-prompts/learn.md
model = "anthropic/claude-opus-5-5"
thinking = "xhigh"

# A claw's own jobs, in its claw.toml:
#
# [[job]]
# name = "daily"
# cron = "0 7 * * *"           # optional: without it, only triggers run it
# prompt = "..."
# active_hours = "07:00-23:00"  # optional
# silent_ok = false             # true: no thread unless it has news
# model = "..."                 # optional overrides for the job's runs
# thinking = "..."
