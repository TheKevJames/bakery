# Gateway settings, and defaults for every claw. Each claws/<name>/claw.toml
# may override any [claw] value (tables merge key by key) and adds its jobs.
# Apply changes with `bakery gateway reload`.

[gateway]
timezone = "Europe/Lisbon"  # cron schedules and the daily budget reset
max_processes = 4           # live pi children across all claws
daily_cost_usd = 50.0       # across all claws

[gateway.discord]
guild_id = 1465773145427280065  # my private server
owner_id = 523678345662300161   # the only user the bot acts on

[claw]
enabled = true
model = "anthropic/claude-sonnet-5-5"
thinking = "high"
# Environment variables passed to the claw; values come from the gateway's
# environment or the Keychain (see bakery/bakery/secrets.py). Nothing else from
# the gateway's environment is passed on beyond PATH, HOME, locale, XDG_*, and
# TASK_FOLDER. Entries are `NAME` or `NAME=ITEM` (the variable NAME, valued
# from secret ITEM). Bash never sees them; only pi and its extension tools do.
secrets = [
    "ANTHROPIC_API_KEY",
    "JINA_API_KEY",                # web_search, web_fetch
    "GH_TOKEN=BAKERY_GITHUB_READ", # github: a read-only fine-grained token
]
# cwd defaults to the claw's state dir, $XDG_STATE_HOME/claws/<name>.

# Enforced in the claw's pi by pi/claw-extensions/policy. Relative paths are
# relative to the claw's profile (claws/<name>/); ~ and ${VAR} expand.
[claw.policy]
# Tool names; `*` matches any characters. Anything else is blocked.
tools = [
    "read", "grep", "find", "ls", "bash",
    "ask_user", "web_search", "web_fetch", "github", "mcp__context7__*",
    "memory_append", "memory_search", "memory_get", "propose_user_update",
]
# Writable by bash and edit/write, besides $TMPDIR. Memory is only written
# through the memory tools.
write_paths = []
# Unreadable by bash and the file tools. The gateway also denies the claw
# state dir, except the claw's own state and _shared.
deny_read = [
    "~/.ssh", "~/.aws", "~/.gnupg", "~/.netrc", "~/Library/Keychains",
    "~/.config/gh", "~/.config/gcloud", "~/.config/zsh/dropins/nobackup-*",
    "../../interactive/auth.json",
]
# Paths under the claw state root ($XDG_STATE_HOME/claws) readable besides
# the claw's own state and _shared, eg. other claws' memory. Nothing outside
# the state root may be re-allowed.
allow_read = []
# Domains bash may reach (eg. "pypi.org", "*.githubusercontent.com"); empty
# means none. web_*, github, and MCP tools run outside bash.
network = []
# Regexes on tool names or bash commands that need my approval in Discord.
confirm = []

[claw.limits]
cost_usd = 5.0        # per run
minutes = 30          # per run, excluding time waiting on me
turns = 50            # per run
daily_cost_usd = 20.0

[claw.concurrency]
max_active = 1         # concurrent new units of work
max_resumes = 0        # extra slots for resumed units (eg. PR feedback)
idle_exit_minutes = 15 # idle pi children exit; resume reloads the session

[claw.ask]
policy = "ask"         # ask | assume | park
timeout_hours = 4
on_timeout = "park"    # assume | park

[claw.memory]
flush_margin_tokens = 8000  # flush memory this close to compaction
max_chars = 20000           # MEMORY.md's cap; match its context.toml budget

# Jobs here apply to every claw; a claw's job of the same name replaces one.
[[claw.job]]
name = "dream"
cron = "0 3 * * *"
prompt = "/dream"  # pi/claw-prompts/dream.md
model = "anthropic/claude-sonnet-5-5"
silent_ok = true
tools = ["memory_edit"]  # only dream runs may rewrite MEMORY.md

# A claw's own jobs, in its claw.toml:
#
# [[job]]
# name = "daily"
# cron = "0 7 * * *"
# prompt = "..."
# active_hours = "07:00-23:00"  # optional
# silent_ok = false             # true: no thread unless it has news
# model = "..."                 # optional overrides for the job's runs
# thinking = "..."
# tools = []                    # added to the claw's policy.tools
